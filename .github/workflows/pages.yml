name: Pages

# Publishes the browser demo in samples/CompanyDueDiligence.Web to GitHub Pages. Pages must be set to "GitHub Actions" in the repository's settings.
on:
  push:
    branches: [main]
    paths: ['src/**', 'samples/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/CompanyDueDiligence.Tests -c Release
      - run: dotnet publish samples/CompanyDueDiligence.Web -c Release -o publish
      # The site is served under /<repository>/, and Pages answers a deep link with 404.html.
      - run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
